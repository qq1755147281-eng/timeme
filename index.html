    // 当前分类 cn / buddhist / taoist
    let festivalCat = 'cn';
    function getFestDataByCat() {
      switch (festivalCat) {
        case 'buddhist': return FEST_BUDDHIST;
        case 'taoist':   return FEST_TAOIST;
        default:         return FEST_CN;
      }
    }
    // 分类切换：顶栏三个按钮
    document.querySelectorAll('.fc-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        SoundFX.festival();
        festivalCat = btn.dataset.cat || 'cn';
        document.querySelectorAll('.fc-btn').forEach(b => b.classList.toggle('is-active', b === btn));
        buildFestivalList(festivalYear);
      });
    });

    // 允许外部强制覆盖"今天"（调试用：window.mockFestivalToday = '2026-02-17'）
    let __mockFestivalToday = null;
    function __getEffectiveToday() {
      if (__mockFestivalToday) {
        const d = new Date(__mockFestivalToday);
        if (!isNaN(d.getTime())) return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0);
      }
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0);
    }

    // 判断某阳历日期是否落在"今天往前推 2 天 ~ 今天"区间（即含今天共 3 天）
    // 命中条件：D ∈ [今天 - 2, 今天]，也就是 节前 3 天 ~ 当天
    function isFestivalNear(solarDate) {
      if (!solarDate) return false;
      const today0 = __getEffectiveToday();
      const fest0 = new Date(solarDate.getFullYear(), solarDate.getMonth(), solarDate.getDate(), 0, 0, 0);
      const diffDays = Math.round((fest0.getTime() - today0.getTime()) / (24 * 60 * 60 * 1000));
      // diffDays = 0 → 当天；= -1 → 昨天（已经过了，不亮）；= 1 → 明天（亮）；= 2 → 后天（亮）
      // 要求 提前 3 天到当天（今天、明天、后天、再后天？严格按"前三天+当天共4天窗口"是 diffDays ∈ {-2,-1,0,1,2,3?}…）
      // 用户表述：节前3天开始亮，当天仍亮，当天过后第2天（即次日）恢复原状
      // → 若 节日在 N 号：亮的范围是 N-3、N-2、N-1、N 共 4 天（严格从 节前第3天早上 到 节日当天结束）
      //   也就是今天 T：fest ∈ [T, T+3] 时 亮（从"今天"往后 3 天都算"临近/节日当天"）
      //   若 T 已经是 节日次日 N+1：diffDays = -1 → 不亮 → 符合"过了第二天不发光"
      return (diffDays >= 0 && diffDays <= 3);
    }

    function buildFestivalList(targetYear) {
      const list = document.getElementById('festivalList');
      const now = new Date();
      const currentYear = now.getFullYear();
      const baseYear = targetYear || currentYear;
      document.getElementById('fyYear').textContent = baseYear + '年';
      const data = getFestDataByCat();
      list.innerHTML = '';

      data.forEach(fest => {
        const type = fest.type, m = fest.m, d = fest.d, name = fest.name, alias = fest.alias;
        let solarDate;
        let lunarMonth, lunarDay;
        let lunarYearForStr = baseYear;

        if (type === 'lunar') {
          lunarMonth = m;
          // 该农历月没有三十日时（如部分年份腊月只有廿九），落到当月最后一日，避免除夕等节日错日
          lunarDay = Math.min(d, monthDays(baseYear, m));
          solarDate = lunarToSolar(baseYear, m, lunarDay, 12);
        } else {
          solarDate = new Date(baseYear, m - 1, d, 12, 0, 0);
          const lunar = solarToLunar(solarDate);
          lunarMonth = lunar.month;
          lunarDay = lunar.day;
          lunarYearForStr = lunar.year;
        }
        if (!solarDate) return;

        const itemYGz = getYearGanZhi(solarDate.getFullYear());
        const itemMGz = getMonthGanZhi(solarDate);
        const itemDGz = getDayGanZhi(solarDate);

        const monthName = LUNAR_MONTH_PREFIX[lunarMonth - 1];
        const dayName = dayToChinese(lunarDay);
        const lunarCn = yearToChinese(lunarYearForStr) + '年' + monthName + '月' + dayName + '日';

        const item = document.createElement('div');
        item.className = 'festival-item';
        if (isFestivalNear(solarDate)) item.classList.add('is-upcoming');
        // 存一下阳历日期，供定时刷新状态使用
        try { item.dataset.festDate = solarDate.getFullYear() + '-' + String(solarDate.getMonth()+1).padStart(2,'0') + '-' + String(solarDate.getDate()).padStart(2,'0'); } catch(e){}
        item.innerHTML =
          '<div class="fi-row1">' +
            '<span class="fi-name">' + name + '</span>' +
            '<span class="fi-lunar-date">' + alias + '</span>' +
          '</div>' +
          '<div class="fi-row2">' +
            '<div class="fi-cell">' +
              '<span class="fi-cell-label">干支纪年</span>' +
              '<span class="fi-cell-value">' + itemYGz + '年 · ' + itemMGz + '月 · ' + itemDGz + '日</span>' +
            '</div>' +
            '<div class="fi-cell">' +
              '<span class="fi-cell-label">农历大写</span>' +
              '<span class="fi-cell-value">' + lunarCn + '</span>' +
            '</div>' +
          '</div>';
        list.appendChild(item);
      });

      if (!list.children.length) {
        list.innerHTML = '<div style="padding:40px 12px;text-align:center;color:rgba(255,233,168,0.6);font-family:STKaiti,KaiTi,serif;letter-spacing:0.2em;">此年份暂无对应节日数据。</div>';
      }
    }

    // 刷新当前已渲染卡片的"临近/不临近"状态（日期跨天时自动变），不需要重建列表
    function refreshFestivalNearState() {
      const list = document.getElementById('festivalList');
      if (!list) return;
      list.querySelectorAll('.festival-item').forEach(it => {
        const ds = it.dataset.festDate;
        if (!ds) return;
        const d = new Date(ds + 'T12:00:00');
        if (isNaN(d.getTime())) return;
        it.classList.toggle('is-upcoming', isFestivalNear(d));
      });
    }
    // 每 2 分钟检查一次（翻日时最长滞后 ~2 分钟），足够避免页面打开一整天一直不刷新状态
    try { setInterval(refreshFestivalNearState, 2 * 60 * 1000); } catch(e){}

    //   window.setMockFestivalToday('2026-02-17') 强制"今天"为春节当天，检查卡片是否发光

    // ============ 年份切换：±50年限制 ============
    let festivalYear = new Date().getFullYear();

      document.getElementById('fyPrev').disabled = festivalYear <= FESTIVAL_MIN_YEAR;
      document.getElementById('fyNext').disabled = festivalYear >= FESTIVAL_MAX_YEAR;

    document.getElementById('fyPrev').addEventListener('click', () => {
      if (festivalYear <= FESTIVAL_MIN_YEAR) {

        showFestivalToast('时间到此为止，无需过多赘述。\n若想查询，请在50年内进行查询即可。');

      }
      SoundFX.year();
      festivalYear--;
      buildFestivalList(festivalYear);
      updateYearBtns();

    document.getElementById('fyNext').addEventListener('click', () => {
      if (festivalYear >= FESTIVAL_MAX_YEAR) {
        SoundFX.error();
        showFestivalToast('时间到此为止，无需过多赘述。\n若想查询，请在50年内进行查询即可。');
        return;
      }
      SoundFX.year();
      festivalYear++;
      buildFestivalList(festivalYear);
      updateYearBtns();
    });

    buildFestivalList(festivalYear);
    updateYearBtns();

    // ============ 钟表左右两侧：当日节日（竖排呼吸灯） ============
    function collectTodaysFestivals(nowDate) {
      const d = nowDate ? new Date(nowDate) : new Date();
      // 阳历月日
      const sm = d.getMonth() + 1;
      const sd = d.getDate();
      // 农历月日
      let lunar = null;
      try { lunar = solarToLunar(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12)); } catch (e) {}
      const lm = lunar ? lunar.month : null;
      const ld = lunar ? lunar.day : null;
      function matchOne(fest) {
        if (fest.type === 'lunar') return (fest.m === lm && fest.d === ld);
        return (fest.m === sm && fest.d === sd);
      }
      const cnMatches = FEST_CN.filter(matchOne).map(f => ({ ...f, src: 'cn', catName: '中华节日' }));
      const budMatches = FEST_BUDDHIST.filter(matchOne).map(f => ({ ...f, src: 'buddhist', catName: '佛教节日' }));
      const taoMatches = FEST_TAOIST.filter(matchOne).map(f => ({ ...f, src: 'taoist', catName: '道教节日' }));
      return { cn: cnMatches, bud: budMatches, tao: taoMatches };
    }

    function renderSideFestivals(nowDate) {
      const leftBox = document.getElementById('sideFestLeft');
      const rightBox = document.getElementById('sideFestRight');
      if (!leftBox || !rightBox) return;
      const groups = collectTodaysFestivals(nowDate);
      // 每个栏只展示最多 2 条（避免字过长撑破版面），展示顺序按原数据顺序即可
      const leftItems = [];
      const rightItems = [];
      // 重日规则：
      //  - 中华节日 → 左边
      //  - 佛教节日 → 右边
      //  - 三个重日：左=中华，右=[佛教, 道教]（佛教先、道教紧挨其旁）
      //  - 只有佛教 或 佛教+道教但没中华：把佛教提到左侧（道教继续右侧）
      //  - 只有道教 或 中华+道教 无佛教：道教放右侧
      //  - 其他极端情况（仅道教等）：左右做兜底分配
      function pickTop(arr, n) { return arr.slice(0, n); }
      const hasCN  = groups.cn.length > 0;
      const hasBud = groups.bud.length > 0;
      const hasTao = groups.tao.length > 0;
      let useLeftForBuddhistOnly = !hasCN && hasBud;   // 无中华时让佛教占左侧
      // 左侧
      if (hasCN) {
        leftItems.push(...pickTop(groups.cn, 2));
      } else if (useLeftForBuddhistOnly) {
        leftItems.push(...pickTop(groups.bud, 2));
      } else if (hasTao && !hasBud) {
        leftItems.push(...pickTop(groups.tao, 2));
      }
      // 右侧
      // 如果左侧已经放了佛教（useLeftForBuddhistOnly），右侧就不放佛教了
      if (hasBud && !useLeftForBuddhistOnly) {
        rightItems.push(...pickTop(groups.bud, 2));
      }
      if (hasTao) {
        // 若左侧放的是道教（无中华无佛教），跳过道教再塞入右侧；否则始终把道教放右侧佛教之后
        if (!(hasTao && !hasCN && !hasBud)) {
          rightItems.push(...pickTop(groups.tao, 2));
        }
      }

      function renderBox(box, items) {
        box.innerHTML = '';
        items.forEach(it => {
          const el = document.createElement('div');
          el.className = 'sf-item';
          el.dataset.src = it.src;
          const title = it.name;
          const alias = it.alias || '';
          el.innerHTML =
            '<span class="sf-cat">' + it.catName + '</span>' +
            '<span>' + title + '</span>' +
            (alias ? '<span style="font-size:9.5px;opacity:.72;letter-spacing:.16em;margin-top:.4em;display:block;">' + alias + '</span>' : '');
          el.title = (alias ? (alias + ' · ') : '') + title;
          box.appendChild(el);
        });
      }
      renderBox(leftBox, leftItems);
      renderBox(rightBox, rightItems);
    }
    // 初始化 + 每秒刷新一次（翻日就自动更新）
    try { renderSideFestivals(new Date()); } catch (e) {}
    setInterval(() => { try { renderSideFestivals(new Date()); } catch (e) {} }, 60 * 1000);
    // 暴露以便调试：window.mockSideFestivalsDate('2026-02-17') 可模拟特定日期
    window.mockSideFestivalsDate = function (isoDateStr) {
      const d = isoDateStr ? new Date(new Date(isoDateStr).toISOString().slice(0, 10) + 'T12:00:00') : new Date();
      try { renderSideFestivals(d); } catch (e) { console.error(e); }
    };

    // ============ 弹窗通用：打开/关闭 ============
    function openModal(id) {
      SoundFX.modalOpen();
      document.getElementById(id).hidden = false;
      // 打开查询弹窗时，强制切换到阳历Tab，避免显示残留
      if (id === 'modalQuery') {
        // 切换到阳历（同时设置hidden和display双保险）
        const solar = document.getElementById('formSolar');
        const lunar = document.getElementById('formLunar');
        document.querySelectorAll('.qf-tab').forEach(t => t.classList.toggle('is-active', t.dataset.mode === 'solar'));
        solar.style.display = '';
        solar.hidden = false;
        lunar.style.display = 'none';
        lunar.hidden = true;
        queryMode = 'solar';
      }
    }
    function closeModal(id) {
      SoundFX.modalClose();
      document.getElementById(id).hidden = true;
    }
    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });
    // 点击遮罩关闭
    document.querySelectorAll('.modal').forEach(m => {
      m.addEventListener('click', e => { if (e.target === m) m.hidden = true; });
    });

    // ============ 查 / 秘 按钮 ============
    document.getElementById('btnQuery').addEventListener('click', () => { SoundFX.click(); openModal('modalQuery'); });
    document.getElementById('btnSecret').addEventListener('click', () => {
      SoundFX.click();
      resetSecret();
      openModal('modalSecret');
    });

    // ============ 查询逻辑 ============
    // 时辰干支：根据时辰索引推算时干
    function getHourGanZhi(hour) {
      const dayGz = getDayGanZhi(new Date()); // 近似，精确需根据查询日期
      const dayStemIdx = GAN.indexOf(dayGz[0]);
      const shichenIdx = Math.floor(((hour + 1) % 24) / 2);
      // 日干起时：甲己日起甲子时
      const startIdx = dayStemIdx % 5;
      const hourStemIdx = (startIdx * 2 + shichenIdx) % 10;
      return GAN[hourStemIdx] + ZHI[shichenIdx];
    }

    // 根据指定日期计算时柱（精确）
    function getHourGanZhiByDate(date) {
      const dayGz = getDayGanZhi(date);
      const dayStemIdx = GAN.indexOf(dayGz[0]);
      const shichenIdx = Math.floor(((date.getHours() + 1) % 24) / 2);
      const startIdx = dayStemIdx % 5;
      const hourStemIdx = (startIdx * 2 + shichenIdx) % 10;
      return GAN[hourStemIdx] + ZHI[shichenIdx];
    }

    // ============ 查询：阳历 / 公历 切换 ============
    let queryMode = 'solar';

    function switchQueryMode(mode) {
      queryMode = mode;
      document.querySelectorAll('.qf-tab').forEach(t => t.classList.toggle('is-active', t.dataset.mode === mode));
      const solar = document.getElementById('formSolar');
      const lunar = document.getElementById('formLunar');
      if (mode === 'solar') {
        solar.style.display = '';
        lunar.style.display = 'none';
        solar.hidden = false;
        lunar.hidden = true;
      } else {
        solar.style.display = 'none';
        lunar.style.display = '';
        solar.hidden = true;
        lunar.hidden = false;
      }
    }
    document.querySelectorAll('.qf-tab').forEach(tab => {
      tab.addEventListener('click', () => { SoundFX.tab(); switchQueryMode(tab.dataset.mode); });
    });

    // 填充结果到指定后缀（S = solar, L = lunar）
    function setResult(date, suffix) {
      const suf = suffix; // 'S' or 'L'
      const yGz = getYearGanZhi(date.getFullYear());
      const mGz = getMonthGanZhi(date);
      const dGz = getDayGanZhi(date);
      const hGz = getHourGanZhiByDate(date);
      document.getElementById('qrBazi' + suf).textContent = `${yGz}年 ${mGz}月 ${dGz}日 ${hGz}时`;

      const lunar = solarToLunar(date);
      const leapPrefix = lunar.isLeap ? '闰' : '';
      document.getElementById('qrLunar' + suf).textContent =
        yearToChinese(lunar.year) + '年' + leapPrefix + LUNAR_MONTH_PREFIX[lunar.month - 1] + '月' + dayToChinese(lunar.day) + '日';

      const pad = n => String(n).padStart(2, '0');
      document.getElementById('qrSolar' + suf).textContent =
        `${date.getFullYear()}年${pad(date.getMonth()+1)}月${pad(date.getDate())}日 ${pad(date.getHours())}时`;

      document.getElementById('queryResult' + (suf === 'S' ? 'Solar' : 'Lunar')).hidden = false;
    }

    // ============ 拨动选择器 ============
    // 数据源
    const ROLLER_DATA = {
      'cn-year': Array.from({length: 100}, (_, i) => { const y = 2000 + i; return {val: i, text: yearToChinese(y)}; }),
      'cn-month': LUNAR_MONTH_PREFIX.map((p, i) => ({val: i, text: p + '月'})),
      'cn-day': Array.from({length: 30}, (_, i) => ({val: i, text: dayToChinese(i + 1)})),
      'cn-hour': ZHI.map((z, i) => ({val: i, text: z + '时'})),
      'bazi': (() => {
        const arr = [];
        for (let i = 0; i < 60; i++) arr.push({val: i, text: GAN[i % 10] + ZHI[i % 12]});
        return arr;
      })()
    };

    const rollerStates = {};

    function getRollerText(roller) {
      const type = roller.dataset.type;
      const val = parseInt(roller.dataset.val);
      if (type && ROLLER_DATA[type]) {
        const item = ROLLER_DATA[type].find(d => d.val === val);
        return item ? item.text : String(val);
      }
      return String(val);
    }

    function buildRoller(roller) {
      const id = roller.dataset.id;
      const type = roller.dataset.type;
      const min = parseInt(roller.dataset.min || 0);
      const max = parseInt(roller.dataset.max || 0);
      rollerStates[id] = { type, min, max, val: parseInt(roller.dataset.val) };

      const upBtn = document.createElement('div');
      upBtn.className = 'roller-btn';
      upBtn.textContent = '▲';
      const valBox = document.createElement('div');
      valBox.className = 'roller-val';
      valBox.textContent = getRollerText(roller);
      const dnBtn = document.createElement('div');
      dnBtn.className = 'roller-btn';
      dnBtn.textContent = '▼';

      roller.appendChild(upBtn);
      roller.appendChild(valBox);
      roller.appendChild(dnBtn);

      const change = (delta) => {
        SoundFX.roller();
        const s = rollerStates[id];
        if (s.type && ROLLER_DATA[s.type]) {
          const arr = ROLLER_DATA[s.type];
          let idx = arr.findIndex(d => d.val === s.val);
          idx = (idx + delta + arr.length) % arr.length;
          s.val = arr[idx].val;
        } else {
          s.val += delta;
          if (s.val < s.min) s.val = s.max;
          if (s.val > s.max) s.val = s.min;
        }
        valBox.textContent = getRollerText(roller);
        roller.dataset.val = s.val;
        valBox.classList.remove('changed');
        void valBox.offsetWidth;
        valBox.classList.add('changed');
      };

      upBtn.addEventListener('click', () => change(1));
      dnBtn.addEventListener('click', () => change(-1));
      // 滚轮支持
      roller.addEventListener('wheel', (e) => {
        e.preventDefault();
        change(e.deltaY < 0 ? 1 : -1);
      }, { passive: false });
    }

    document.querySelectorAll('.roller').forEach(buildRoller);

    function getRollerVal(id) {
      return rollerStates[id] ? rollerStates[id].val : 0;
    }

    // ============ 农历转阳历 ============
    function lunarToSolar(year, month, day, hour) {
      if (!lunarInfo[year - 1900]) return null;
      let days = 0;
      // 先累加 1900 到 year-1 所有整年的天数
      for (let y = 1900; y < year; y++) {
        days += lunarYearDays(y);
      }
      // 再累加 year 年 1 月 到 month-1 月的天数
      const leapM = leapMonth(year);
      for (let i2 = 1; i2 < month; i2++) days += monthDays(year, i2);
      // 若闰月出现在目标月之前，还要加上闰月天数
      if (leapM > 0 && leapM < month) days += leapDays(year);
      days += day - 1;
      const result = new Date(1900, 0, 31);
      result.setDate(result.getDate() + days);
      result.setHours(hour || 12, 0, 0, 0);
      return result;
    }

    // 八字 → 阳历（按年柱反推年，日柱遍历全年找日期）
    function baziToSolar(yearGz, dayGz, hour) {
      let year = 1984;
      while (getYearGanZhi(year) !== yearGz && year < 2100) year++;
      if (year >= 2100) return null;
      if (!dayGz) return new Date(year, 5, 15, hour);
      const start = new Date(year, 0, 1, hour);
      for (let i = 0; i < 366; i++) {
        const dt = new Date(start.getTime() + i * 86400000);
        if (dt.getFullYear() !== year) break;
        if (getDayGanZhi(dt) === dayGz) return dt;
      }
      return new Date(year, 5, 15, hour);
    }

    // 阳历查询 → 填到 S 结果区
    document.getElementById('btnDoQuery').addEventListener('click', () => {
      SoundFX.confirm();
      const y = getRollerVal('rollSY');
      const mo = getRollerVal('rollSM');
      const d = getRollerVal('rollSD');
      const h = getRollerVal('rollSH');
      const date = new Date(y, mo - 1, d, h, 0, 0);
      setResult(date, 'S');
    });

    // 公历：大写汉字 查询 → 填到 L 结果区
    document.getElementById('btnDoQueryCn').addEventListener('click', () => {
      SoundFX.confirm();
      const yIdx = getRollerVal('rollLY');
      const mIdx = getRollerVal('rollLM');
      const dIdx = getRollerVal('rollLD');
      const hIdx = getRollerVal('rollLH');
      const year = 2000 + yIdx;
      const month = mIdx + 1;
      const day = dIdx + 1;
      const hour = hIdx * 2;
      const date = lunarToSolar(year, month, day, hour);
      if (!date) { alert('无法解析，请调整选择'); return; }
      setResult(date, 'L');
    });

    // 公历：生辰八字 查询 → 填到 L 结果区
    document.getElementById('btnDoQueryBazi').addEventListener('click', () => {
      SoundFX.confirm();
      const yIdx = getRollerVal('rollBY');
      const dIdx = getRollerVal('rollBD');
      const hIdx = getRollerVal('rollBH');
      const yearGz = ROLLER_DATA.bazi[yIdx].text;
      const dayGz = ROLLER_DATA.bazi[dIdx].text;
      const hour = hIdx * 2;
      const date = baziToSolar(yearGz, dayGz, hour);
      if (!date) { alert('无法解析，请调整选择'); return; }
      setResult(date, 'L');
    });

    // ============ 九宫格密码 ============
    // 12时辰：子丑寅卯辰巳午未申酉戌亥（一行4个，三行）
    const SECRET_CELLS = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    // 密码序列：5位 酉→酉→酉→亥→寅
    const SECRET_CODE = ['酉','酉','酉','亥','寅'];
    let secretInput = [];

    function buildSecretGrid() {
      const grid = document.getElementById('secretGrid');
      grid.innerHTML = '';
      SECRET_CELLS.forEach(ch => {
        const cell = document.createElement('div');
        cell.className = 'sg-cell';
        cell.textContent = ch;
        cell.dataset.ch = ch;
        cell.addEventListener('click', () => onSecretClick(cell, ch));
        grid.appendChild(cell);
      });
      // 进度点（5个）
      const progress = document.getElementById('secretProgress');
      progress.innerHTML = '';
      for (let i = 0; i < SECRET_CODE.length; i++) {
        const dot = document.createElement('span');
        dot.className = 'sp-dot';
        progress.appendChild(dot);
      }
    }
    buildSecretGrid();

    function resetSecret() {
      secretInput = [];
      document.querySelectorAll('.sg-cell').forEach(c => c.classList.remove('selected', 'error'));
      document.getElementById('secretError').hidden = true;
      updateSecretProgress();
    }

    function updateSecretProgress() {
      const dots = document.querySelectorAll('.sp-dot');
      dots.forEach((d, i) => {
        d.classList.toggle('filled', i < secretInput.length);
      });
    }

    function showSecretError() {
      const err = document.getElementById('secretError');
      err.textContent = '您输的密码错误，此密码仅为至亲之人设计，其他人无法进入。';
      err.hidden = false;
    }

    function onSecretClick(cell, ch) {
      SoundFX.secret();
      // 允许重复点击同一格（支持 酉酉酉 序列）
      secretInput.push(ch);
      cell.classList.add('selected');
      updateSecretProgress();

      const idx = secretInput.length - 1;
      if (secretInput[idx] !== SECRET_CODE[idx]) {
        // 错误
        SoundFX.error();
        cell.classList.add('error');
        showSecretError();
        setTimeout(() => {
          resetSecret();
        }, 1500);
        return;
      }

      if (secretInput.length === SECRET_CODE.length) {
        // 密码正确
        SoundFX.unlock();
        setTimeout(() => {
          closeModal('modalSecret');
          buildFamilyList();
          openModal('modalFamily');
        }, 400);
      }
    }

    // ============ 家人生日数据 ============
    // [关系, 姓名, 阳历年, 月, 日]
    const FAMILY_DATA = [
      ['父亲', '李文山', 1965, 3, 12],
      ['母亲', '王秀英', 1968, 7, 25],
      ['兄长', '李志远', 1990, 11, 8],
      ['姐姐', '李雅芳', 1993, 5, 18],
      ['本人', '李子墨', 1996, 8, 27],
      ['妹妹', '李雨桐', 1999, 2, 14],
      ['姐夫', '陈嘉伟', 1991, 9, 3],
      ['侄女', '陈思颖', 2020, 12, 15]
    ];

    function buildFamilyList() {
      const list = document.getElementById('familyList');
      list.innerHTML = '';
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const thisYear = now.getFullYear();

      FAMILY_DATA.forEach(([relation, name, y, m, d]) => {
        const date = new Date(y, m - 1, d, 12, 0, 0);
        const lunar = solarToLunar(date);
        const leapPrefix = lunar.isLeap ? '闰' : '';
        const lunarStr = yearToChinese(lunar.year) + '年' +
          leapPrefix + LUNAR_MONTH_PREFIX[lunar.month - 1] + '月' +
          dayToChinese(lunar.day) + '日';
        const pad = n => String(n).padStart(2, '0');
        const solarStr = `${y}年${pad(m)}月${pad(d)}日`;

        // 倒计时：按今年阳历生日
        const thisYearBirthday = new Date(thisYear, m - 1, d);
        thisYearBirthday.setHours(0, 0, 0, 0);
        let cdText, cdClass = '';
        if (thisYearBirthday < now) {
          cdText = '已过生日';
          cdClass = 'is-past';
        } else {
          const diffDays = Math.round((thisYearBirthday - now) / (1000 * 60 * 60 * 24));
          if (diffDays === 0) {
            cdText = '今日生日';
            cdClass = 'is-today';
          } else if (diffDays <= 7) {
            cdText = `距下次生日：${diffDays}天`;
            cdClass = 'is-soon';
          } else {
            cdText = `距下次生日：${diffDays}天`;
          }
        }

        const item = document.createElement('div');
        item.className = 'family-item';
        item.innerHTML =
          `<div class="fi-relation">${relation}</div>` +
          `<div class="fi-info">` +
            `<div class="fi-name-row ${cdClass}">` +
              `<span class="fi-name">${name}</span>` +
              `<span class="fi-cd">　${cdText}</span>` +
            `</div>` +
            `<div class="fi-lunar">（阳历）${solarStr}</div>` +
            `<div class="fi-lunar">（农历）${lunarStr}</div>` +
          `</div>`;
        list.appendChild(item);
      });
    }
  </script>
